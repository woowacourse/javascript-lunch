<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>점심 뭐 먹지</title>
  </head>
  <body>
    <div id="app">
          <!-- GNB -->
      <div class="container">
        <div class="layout">

          <header class="gnb">
            <h1 id="title-logo" class="gnb__title text-title" data-action="reload">점심 뭐 먹지</h1>
            <button type="button" class="gnb__button" aria-label="음식점 추가" id="openModalBtn">
              <img src="./images/add-button.png" alt="음식점 추가">
            </button>
          </header>
          <main>
              <!-- 음식점 목록 -->
              <section id="restaurantListSection" class="restaurant-list-container"></section>
              </section>
            </main>
          
          </div>
      </div>
     

          <div id="modalBackground" data-action="removeModal">
            <template id="modalTemplate">
              <div class="modal modal--open">
        <div class="modal-container">
          <h2 class="modal-title text-title">새로운 음식점</h2>


          <form id="restaurantForm">

            <!-- 카테고리 -->
            <div class="form-item form-item--required">
              <label for="category text-caption">카테고리</label>
              <select name="category" id="category" required>
                <option value="">선택해 주세요</option>
                <option value="한식">한식</option>
                <option value="중식">중식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="아시안">아시안</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <!-- 음식점 이름 -->
            <div class="form-item form-item--required">
              <label for="name text-caption">이름</label>
              <input type="text" name="name" id="name" required>
            </div>

            <!-- 거리 -->
            <div class="form-item form-item--required">
              <label for="distance text-caption">거리(도보 이동 시간) </label>
              <select name="distance" id="distance" required>
                <option value="">선택해 주세요</option>
                <option value="5">5분 내</option>
                <option value="10">10분 내</option>
                <option value="15">15분 내</option>
                <option value="20">20분 내</option>
                <option value="30">30분 내</option>
              </select>
            </div>

            <!-- 설명 -->
            <div class="form-item">
              <label for="description text-caption">설명</label>
              <textarea name="description" id="description" cols="30" rows="5"></textarea>
              <span class="help-text text-caption">메뉴 등 추가 정보를 입력해 주세요.</span>
            </div>

            <!-- 링크 -->
            <div class="form-item">
              <label for="link text-caption">참고 링크</label>
              <input type="url" name="link" id="link">
              <span class="help-text text-caption">매장 정보를 확인할 수 있는 링크를 입력해 주세요.</span>
            </div>

            <!-- 취소/추가 버튼 -->
            <div id="buttonContainer" class="button-container" >
              <button type="button" class="button button--secondary text-caption" id="closeModalBtn" data-action="removeModal">취소하기</button>
              <button class="button button--primary text-caption">추가하기</button>
            </div>
          </form>
        </div>
      </div>
  
    </template>
  
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/utils/ClickEvent.js"></script>
    <script type="module" src="/src/utils/SubmitEvent.js"></script>
    <script type="module" src="/src/components//Button.js"></script>
    <script>
      function openModal() {
      const modalBackground = document.getElementById("modalBackground");

      if (modalBackground.querySelector(".modal-container")) {
        modalBackground.classList.add("show");
        return;
      }

      const modalClone = document.getElementById("modalTemplate").content.cloneNode(true);
      modalBackground.appendChild(modalClone);

      modalBackground.classList.remove("show");
      modalBackground.classList.add("hide"); 

      setTimeout(() => {
        modalBackground.classList.add("show");
        modalBackground.classList.remove("hide"); 
      }, 10);
    }


    document.getElementById('openModalBtn').addEventListener('click', () => {
      openModal();
    });

    </script>
  </body>
</html>
