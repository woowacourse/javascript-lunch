<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>점심 뭐 먹지</title>
    <link rel="stylesheet" href="index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="./src/main.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- GNB -->
      <header class="gnb">
        <div class="gnb__top">
          <h1 class="gnb__title text-title">점심 뭐먹지</h1>
          <button type="button" class="gnb__button" aria-label="음식점 추가">
            <img class="restaurant-add-button" src="./add-button.png" alt="음식점 추가" />
          </button>
        </div>
      
        <div id="favorite-filter" class="favorite-filter">
          <input type="radio" id="filter-all" name="favoriteFilter" value="all" checked />
          <label for="filter-all">모든 음식점</label>
      
          <input type="radio" id="filter-favorite" name="favoriteFilter" value="favorite" />
          <label for="filter-favorite">자주 가는 음식점</label>
        </div>
      
        <section class="restaurant-filter-container">
          <select name="category" id="category-filter" class="restaurant-filter">
            <option value="전체">전체</option>
            <option value="한식">한식</option>
            <option value="중식">중식</option>
            <option value="일식">일식</option>
            <option value="양식">양식</option>
            <option value="아시안">아시안</option>
            <option value="기타">기타</option>
          </select>
          <select name="sorting" id="sorting-filter" class="restaurant-filter">
            <option value="name">이름순</option>
            <option value="distance">거리순</option>
          </select>
        </section>
      </header>
      <main>
        </section>
        <section class="restaurant-list-container">
          <ul class="restaurant-list" id="restaurant-list"></ul>
        </section>
        <dialog class="modal form-modal">
          <div class="modal-backdrop"></div>
          <div class="modal-container">
            <h2 class="modal-title text-title">새로운 음식점</h2>
          </div>
        </dialog>
        <dialog class="modal description-modal">
          <div class="modal-backdrop"></div>
          <div class="modal-container description"></div>
        </dialog>
      </main>
    </div>
  </body>
</html>
